[project]
name = "podcast-clips"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podcast_clips"]
